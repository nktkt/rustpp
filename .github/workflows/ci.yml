name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  rustpp:
    name: Rust++ MVP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustc --version
          cargo --version

      - name: Rust++ CI
        run: cargo run -p rpp --bin rpp -- ci --report rustpp-report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rustpp-report
          path: rustpp-report.json
          if-no-files-found: ignore

